@if (control) {
  <div class="mb-3">
    @if (groupConfig.label) {
      <div id="{{id}}-label" class="mb-1" [style.color]="errorMessage ? '#f44336' : null">{{ groupConfig.label }}</div>
    }
    <mat-button-toggle-group [formControl]="control"
                             [multiple]="!!groupConfig.multiple"
                             [name]="id"
                             [appearance]="groupConfig.appearance || 'standard'"
                             [attr.aria-labelledby]="groupConfig.label ? id + '-label' : null"
                             [attr.aria-describedby]="errorMessage ? id + '-error' : null"
                             [attr.aria-invalid]="errorMessage ? true : null"
                             [attr.aria-required]="isRequired || null"
                             (change)="orderValue()">
      @for (option of options(); track option.id) {
        <mat-button-toggle [value]="option.id" [disabled]="!!option.disabled">{{ option.label }}</mat-button-toggle>
      }
    </mat-button-toggle-group>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <div class="mt-1" id="{{id}}-error" style="font-size: 0.75rem; color: #f44336;">{{ errorMessage }}</div>
      }
    </div>
  </div>
}
