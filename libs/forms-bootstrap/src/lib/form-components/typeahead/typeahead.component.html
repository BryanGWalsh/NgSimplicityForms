@if (control) {
  <div class="mb-3">
    <label [class.text-danger]="!!errorMessage" class="form-label" for="{{id}}">{{ typeaheadConfig.label }}</label>
    <input [class.border-danger]="!!errorMessage"
           [formControl]="control"
           class="form-control"
           id="{{id}}"
           type="text"
           autocomplete="off"
           [attr.list]="id + '-list'"
           placeholder="{{ typeaheadConfig.placeholder || '' }}"
           [attr.aria-invalid]="errorMessage ? true : null"
             [attr.aria-describedby]="errorMessage ? id + '-error' : null"
             [attr.aria-required]="isRequired || null" />
    <datalist id="{{id}}-list">
      @for (option of options(); track option.id) {
        @if (!option.disabled) {
          <option [value]="option.label"></option>
        }
      }
    </datalist>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
          {{ errorMessage }}
        </div>
      }
    </div>
  </div>
}
