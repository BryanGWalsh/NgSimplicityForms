@if (control) {
  @if (selectConfig.labelLocation === 'top') {
    <div class="mb-3">
      <label [class.text-danger]="!!errorMessage" class="form-label" for="{{id}}">{{ selectConfig.label }}</label>
      <select [attr.aria-label]="selectConfig.label" 
              [class.border-danger]="!!errorMessage" 
              [formControl]="control"
              class="form-select"
              id="{{id}}"
              [attr.aria-invalid]="errorMessage ? true : null"
              [attr.aria-describedby]="errorMessage ? id + '-error' : null"
              [attr.aria-required]="isRequired || null">
        @if (selectConfig.placeholder) {
          <option [disabled]="true" [ngValue]="selectConfig.placeHolderValue ?? ''">{{ selectConfig.placeholder }}</option>
        }
        @for (option of options(); track option.id) {
          <option [disabled]="!!option.disabled" [ngValue]="option.id">
            {{ option.label }}
          </option>
        }
      </select>
      <div aria-live="polite" aria-atomic="true">
        @if (errorMessage) {
          <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
            {{ errorMessage }}
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="mb-3 row">
      <label [class.text-danger]="!!errorMessage" class="col-sm-2 col-form-label"
             for="{{id}}">{{ selectConfig.label }}</label>
      <div class="col-sm-10">
        <select [attr.aria-label]="selectConfig.label" 
                [class.border-danger]="!!errorMessage" 
                [formControl]="control"
                class="form-select"
                id="{{id}}"
                [attr.aria-invalid]="errorMessage ? true : null"
                [attr.aria-describedby]="errorMessage ? id + '-error' : null"
                [attr.aria-required]="isRequired || null">
          @if (selectConfig.placeholder) {
            <option [disabled]="true" [ngValue]="selectConfig.placeHolderValue ?? ''">{{ selectConfig.placeholder }}</option>
          }
          @for (option of options(); track option.id) {
            <option [disabled]="!!option.disabled" [ngValue]="option.id">
              {{ option.label }}
            </option>
          }
        </select>
        <div aria-live="polite" aria-atomic="true">
          @if (errorMessage) {
            <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
              {{ errorMessage }}
            </div>
          }
        </div>
      </div>
    </div>
  }
}
