@if (control) {
  <div class="mb-3">
    @if (groupConfig.label) {
      <div [class.text-danger]="!!errorMessage" class="form-label" id="{{id}}-label">{{ groupConfig.label }}</div>
    }
    <div class="btn-group"
         [class.btn-group-sm]="groupConfig.size === 'sm'"
         [class.btn-group-lg]="groupConfig.size === 'lg'"
         [attr.role]="groupConfig.multiple ? 'group' : 'radiogroup'"
         [attr.aria-labelledby]="groupConfig.label ? id + '-label' : null"
         [attr.aria-describedby]="errorMessage ? id + '-error' : null"
         [attr.aria-required]="isRequired || null">
      @for (option of options(); track option.id; let i = $index) {
        <input class="btn-check"
               autocomplete="off"
               id="{{id}}-{{i}}"
               [attr.name]="id"
               [attr.type]="groupConfig.multiple ? 'checkbox' : 'radio'"
               [checked]="isSelected(option.id)"
               [disabled]="control.disabled || !!option.disabled"
               [attr.aria-invalid]="errorMessage ? true : null"
               (change)="choose(option.id)"
               (blur)="touch()">
        <label class="btn {{ groupConfig.buttonClass || (errorMessage ? 'btn-outline-danger' : 'btn-outline-primary') }}" for="{{id}}-{{i}}">
          {{ option.label }}
        </label>
      }
    </div>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
          {{ errorMessage }}
        </div>
      }
    </div>
  </div>
}
