@if (!!control) {
  @if (textConfig.labelLocation === 'top') {
    <div class="mb-2">
      <label [class.text-danger]="!!errorMessage" class="form-label" for="{{id}}">{{ textConfig.label }}</label>
      <input [class.border-danger]="!!errorMessage" 
             [formControl]="control" 
             class="form-control"
             id="{{id}}" 
             [attr.aria-invalid]="errorMessage ? true : null"
             [attr.aria-describedby]="errorMessage ? id + '-error' : null"
             [attr.aria-required]="isRequired || null"
             placeholder="{{textConfig.placeholder}}" 
             type="{{textConfig.type}}" />
      <div aria-live="polite" aria-atomic="true">
        @if (errorMessage) {
          <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
            {{ errorMessage }}
          </div>
        }
      </div>
    </div>
  }
  @if (textConfig.labelLocation === 'left') {
    <div class="row mb-2">
      <label [class.text-danger]="!!errorMessage" class="col-sm-2 col-form-label"
             for="{{id}}">{{ textConfig.label }}</label>
      <div class="col-sm-10">
        <input [class.border-danger]="!!errorMessage" 
               [formControl]="control" 
               class="form-control"
               id="{{id}}" 
               [attr.aria-invalid]="errorMessage ? true : null"
               [attr.aria-describedby]="errorMessage ? id + '-error' : null"
               [attr.aria-required]="isRequired || null"
               placeholder="{{textConfig.placeholder}}" 
               type="{{textConfig.type}}" />
        <div aria-live="polite" aria-atomic="true">
          @if (errorMessage) {
            <div class="text-danger mt-1" id="{{id}}-error" style="font-size: 0.875rem;">
              {{ errorMessage }}
            </div>
          }
        </div>
      </div>
    </div>
  }
}
