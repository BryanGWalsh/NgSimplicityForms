@if (control) {
  <div [class]="classes.field">
    @if (groupConfig.label) {
      <div [class]="cx(classes.label, errorMessage ? classes.labelInvalid : classes.labelValid)" id="{{id}}-label">{{ groupConfig.label }}</div>
    }
    <div [class]="classes.buttonGroup"
         [attr.role]="groupConfig.multiple ? 'group' : 'radiogroup'"
         [attr.aria-labelledby]="groupConfig.label ? id + '-label' : null"
         [attr.aria-describedby]="errorMessage ? id + '-error' : null"
         [attr.aria-required]="isRequired || null">
      @for (option of options(); track option.id; let i = $index) {
        <label [class]="cx(classes.buttonGroupButton, errorMessage && classes.buttonGroupButtonInvalid)" for="{{id}}-{{i}}">
          <input [class]="classes.toggleInput"
                 id="{{id}}-{{i}}"
                 [attr.name]="id"
                 [attr.type]="groupConfig.multiple ? 'checkbox' : 'radio'"
                 [checked]="isSelected(option.id)"
                 [disabled]="control.disabled || !!option.disabled"
                 [attr.aria-invalid]="errorMessage ? true : null"
                 (change)="choose(option.id)"
                 (blur)="touch()">
          {{ option.label }}
        </label>
      }
    </div>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <p [class]="classes.error" id="{{id}}-error">{{ errorMessage }}</p>
      }
    </div>
  </div>
}
