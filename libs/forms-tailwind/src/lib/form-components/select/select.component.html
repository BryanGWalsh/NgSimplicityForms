@if (control) {
  <div [class]="horizontal ? classes.fieldHorizontal : classes.field">
    <label [class]="cx(horizontal ? classes.labelHorizontal : classes.label, errorMessage ? classes.labelInvalid : classes.labelValid)"
           [attr.for]="inputId">{{ selectConfig.label }}</label>
    <div [class]="horizontal ? classes.controlWrapperHorizontal : ''">
      <select [class]="cx(classes.control, errorMessage ? classes.controlInvalid : classes.controlValid, selectConfig.inputCssClass)"
              [formControl]="control"
              [id]="inputId"
              [attr.aria-invalid]="errorMessage ? true : null"
              [attr.aria-describedby]="errorMessage ? id + '-error' : null">
        @if (selectConfig.placeholder) {
          <option [disabled]="true" [value]="selectConfig.placeHolderValue || ''">{{ selectConfig.placeholder }}</option>
        }
        @for (option of options(); track option.id) {
          <option [disabled]="!!option.disabled" [value]="option.id">{{ option.label }}</option>
        }
      </select>
      @if (errorMessage) {
        <p [class]="classes.error" id="{{id}}-error">{{ errorMessage }}</p>
      }
    </div>
  </div>
}
