@if (control) {
  <div [class]="classes.field">
    <label [class]="cx(classes.label, errorMessage ? classes.labelInvalid : classes.labelValid)" for="{{id}}">{{ typeaheadConfig.label }}</label>
    <input [class]="cx(classes.control, errorMessage ? classes.controlInvalid : classes.controlValid)"
           [formControl]="control"
           id="{{id}}"
           type="text"
           autocomplete="off"
           [attr.list]="id + '-list'"
           placeholder="{{ typeaheadConfig.placeholder || '' }}"
           [attr.aria-invalid]="errorMessage ? true : null"
           [attr.aria-describedby]="errorMessage ? id + '-error' : null"
           [attr.aria-required]="isRequired || null" />
    <datalist id="{{id}}-list">
      @for (option of options(); track option.id) {
        @if (!option.disabled) {
          <option [value]="option.label"></option>
        }
      }
    </datalist>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <p [class]="classes.error" id="{{id}}-error">{{ errorMessage }}</p>
      }
    </div>
  </div>
}
