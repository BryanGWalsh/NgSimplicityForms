@if (control) {
  <div role="radiogroup"
       [class]="classes.radioGroup"
       [attr.aria-labelledby]="radioConfig.label ? id + '-label' : null"
       [attr.aria-describedby]="errorMessage ? id + '-error' : null"
       [attr.aria-required]="isRequired || null">
    <div [class]="radioConfig.alignment === 'horizontal' ? classes.radioOptionsHorizontal : classes.radioOptions">
      @if (!!radioConfig.label) {
        <div [class]="cx(classes.radioGroupLabel, errorMessage ? classes.labelInvalid : classes.labelValid)" id="{{id}}-label">
          {{ radioConfig.label }}
        </div>
      }
      @for (option of options(); track option.id) {
        <div [class]="classes.choice">
          <!-- [name] gives each control its own Angular radio group; without it every radio in the app is one group. -->
          <input [class]="cx(classes.choiceInput, errorMessage && classes.choiceInputInvalid)"
                 [formControl]="control"
                 [value]="option.id"
                 [name]="id"
                 [attr.name]="id"
                 [attr.aria-invalid]="errorMessage ? true : null"
                 id="{{id}}{{option.id}}"
                 type="radio">
          <label [class]="cx(classes.choiceLabel, errorMessage ? classes.labelInvalid : classes.labelValid)"
                 for="{{id}}{{option.id}}">{{ option.label }}</label>
        </div>
      }
    </div>
    <div aria-live="polite" aria-atomic="true">
      @if (errorMessage) {
        <p [class]="classes.error" id="{{id}}-error">{{ errorMessage }}</p>
      }
    </div>
  </div>
}
